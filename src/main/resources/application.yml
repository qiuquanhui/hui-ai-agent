spring:
  application:
    name: hui-ai-agent
  # 启动时自动加载本地密钥配置（application-local.yml 被 git 忽略，不存在也不报错）
  config:
    import: optional:classpath:application-local.yml
  ai:
    dashscope:
      # 真实 key 配置在 application-local.yml 中，此处仅为占位符
      api-key: sk-请把真实key配置在application-local.yml中
      # ollama 的注入
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#          model: granite4.2:3b

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.hui.huiaiagent.controller
